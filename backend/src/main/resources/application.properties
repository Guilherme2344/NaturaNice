# Application Name
quarkus.application.name=produtos-mae

# JWT Configuration (Carregado via .env ou Variáveis de Ambiente)
jwt.secret=${JWT_SECRET:NaturaNiceSuperSecretKeyForJWTAuthTokenSigningInDevEnv2026!}

# PostgreSQL Settings (Configurável via .env ou Variáveis de Ambiente)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/produtos-mae}

# Automatic Database Generation Schema
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Initial Admin Credentials
admin.initial.email=${ADMIN_EMAIL:admin@sistema.com}
admin.initial.password=${ADMIN_PASSWORD:admin123}

# Seeder Sample Data Control (Desativado automaticamente em produção)
seeder.enable-sample-data=${ENABLE_SAMPLE_DATA:true}
%prod.seeder.enable-sample-data=false

# Swagger UI (Desativado no ambiente de produção para segurança)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
%prod.quarkus.swagger-ui.always-include=false

# CORS Configuration (Restrito às origens especificadas em CORS_ALLOWED_ORIGINS)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:3000}
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.access-control-allow-headers=*
quarkus.http.cors.access-control-allow-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD

# Quarkus Mailer Configuration (Configurável via .env ou Variáveis de Ambiente)
quarkus.mailer.auth-methods=PLAIN LOGIN
quarkus.mailer.from=${SMTP_FROM:suporte@naturanice.com}
quarkus.mailer.host=${SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${SMTP_USERNAME:exemplo@gmail.com}
quarkus.mailer.password=${SMTP_PASSWORD:sua_senha_de_app_16_digitos}
quarkus.mailer.mock=${SMTP_MOCK:false}